<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Dual Universe Updater">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1e5"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#33518c" stroke-opacity="0.6"/>

  <!-- circular update arrows -->
  <g fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round">
    <path d="M 96 44 A 38 38 0 1 0 101 74"/>
  </g>
  <path d="M 96 30 L 100 48 L 82 46 Z" fill="#4fd1e5"/>

  <!-- DU wordmark -->
  <text x="64" y="78" text-anchor="middle" font-family="'DejaVu Sans','Segoe UI',sans-serif"
        font-size="40" font-weight="700" fill="#eaf2ff" letter-spacing="1">DU</text>
</svg>
